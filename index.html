<html>
<script src='https://d3js.org/d3.v5.min.js'></script>
<style> circle {fill: lightblue; stroke: black;} </style>
<body onload='init()'>
<svg width=300 height=300>
</svg>
<script>
async function init() {

var x = d3.scaleLog([10,150],[0,200]).base(10)
var y = d3.scaleLog([10,150],[0,200]).base(10)
var gy = d3.scaleLog([10,150],[200,0]).base(10)

const data = await d3.csv("https://flunky.github.io/cars2017.csv")
d3.select("svg")
    .append("g")
    .attr("transform","translate(50,50)")
    .selectAll("circle").data(data).enter().append("circle")
    .attr("cx", function(d){return x(d.AverageCityMPG)})
    .attr("cy", function(d){return 200-(y(d.AverageHighwayMPG))})
    .attr("r", function(d){return Number(d.EngineCylinders)+2})
d3.select("svg")
    .append("g")
    .attr("transform","translate(50,50)")
    .call(
        d3.axisLeft(gy)
        .tickValues([10, 20, 50, 100])
        .tickFormat(d3.format("~s")))
d3.select("svg")
    .append("g")
    .attr("transform","translate(50,250)")
    .call(
        d3.axisBottom(x)
        .tickValues([10, 20, 50, 100])
        .tickFormat(d3.format("~s")))
}
</script>
</body>
</html>
